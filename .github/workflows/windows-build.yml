name: Windows build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/ZeusAudioControl/ZeusAudioControl.csproj
      - name: Build
        run: dotnet build src/ZeusAudioControl/ZeusAudioControl.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/ZeusAudioControl/ZeusAudioControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ZeusAudioControl-win-x64
          path: dist/
          if-no-files-found: error
