name: Windows build
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v0.7.1-beta*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Run synthetic and persistence tests
        run: dotnet run --project tests/ZeusAudioControl.Tests -c Release
      - name: Build Windows x64
        run: dotnet build src/ZeusAudioControl -c Release -r win-x64
      - name: Publish portable executable
        run: dotnet publish src/ZeusAudioControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/portable
      - uses: actions/upload-artifact@v4
        with:
          name: portable-executable
          path: dist/portable/ZeusAudioControl.exe
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: portable-executable
          path: dist/portable
      - name: Install NSIS from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Build installer and portable ZIP
        run: |
          makensis installer/ZeusAudioControl.nsi
          cp LICENSE dist/portable/
          cp -r licenses dist/portable/
          cd dist/portable
          zip -qr ../ZEUS-Audio-Control-Beta-0.7.1-Portable-x64.zip ZeusAudioControl.exe LICENSE licenses
          cd ..
          sha256sum ZEUS-Audio-Control-Beta-0.7.1-{Portable-x64.zip,Setup-x64.exe} > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t ZEUS-Audio-Control-Beta-0.7.1-Portable-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ZeusAudioControl-win-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  install-smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZeusAudioControl-win-x64
          path: dist
      - name: Install and uninstall for the current user
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA 'Programs\ZEUS Audio Control Beta 0.7'
          $app = Join-Path $install 'ZeusAudioControl.exe'
          $uninstaller = Join-Path $install 'Uninstall.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'ZEUS Audio Control.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'ZEUS Audio Control.lnk'
          $oldShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'ZEUS Audio Control Beta 0.5.lnk'
          $shell = New-Object -ComObject WScript.Shell
          foreach ($link in @($shortcut, $desktop, $oldShortcut)) {
            $previous = $shell.CreateShortcut($link)
            $previous.TargetPath = "$env:WINDIR\System32\notepad.exe"
            $previous.IconLocation = "$env:WINDIR\System32\notepad.exe,0"
            $previous.Save()
          }
          $installer = Start-Process dist/ZEUS-Audio-Control-Beta-0.7.1-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0 -or !(Test-Path $app) -or !(Test-Path $shortcut)) {
            throw "Installation did not produce the executable and Start menu shortcut"
          }
          if (Test-Path $oldShortcut) { throw "Legacy shortcut was not migrated" }
          foreach ($link in @($shortcut, $desktop)) {
            if (!(Test-Path $link)) { throw "Missing shortcut: $link" }
            $info = $shell.CreateShortcut($link)
            if ($info.TargetPath -ne $app -or $info.IconLocation -ne "$app,0") {
              throw "Shortcut target or icon is incorrect: $link"
            }
          }
          Expand-Archive dist/ZEUS-Audio-Control-Beta-0.7.1-Portable-x64.zip -DestinationPath portable
          if ((Get-FileHash $app).Hash -ne (Get-FileHash portable/ZeusAudioControl.exe).Hash) {
            throw "Installed executable differs from the portable executable"
          }
          $env:ZEUS_UI_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'zeus-ui-smoke-profile'
          $smoke = Start-Process $app -ArgumentList '--ui-smoke' -PassThru
          if (!$smoke.WaitForExit(30000)) {
            Stop-Process -Id $smoke.Id -Force
            throw "UI smoke test did not exit"
          }
          if ($smoke.ExitCode -ne 0) {
            $details = Join-Path $env:ZEUS_UI_SMOKE_PROFILE 'failure.txt'
            if (Test-Path $details) { Get-Content $details }
            throw "UI smoke test failed"
          }
          Start-Process $uninstaller -ArgumentList '/S' -Wait
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $install); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path $app) -or (Test-Path $shortcut)) {
            throw "Uninstallation left the executable or Start menu shortcut"
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v0.7.1-beta')
    needs: install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZeusAudioControl-win-x64
          path: dist
      - name: Prepare beta release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPOSITORY" --verify-tag --draft --prerelease --title 'ZEUS Audio Control Beta 0.7.1' --notes 'Windows 10/11 x64. The installer and portable executable are unsigned. Verify SHA256SUMS.txt before opening.'
          fi
